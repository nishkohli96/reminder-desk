<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Reminder Desk</title>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0f6b5c"/>
  <!-- clock ring, three-quarters drawn: the time a task comes due -->
  <path d="M64 26 A38 38 0 1 1 26 64" fill="none" stroke="#dcefe9" stroke-width="8" stroke-linecap="round"/>
  <!-- the missing quarter becomes the follow-up tick -->
  <circle cx="34" cy="38" r="5" fill="#f0a265"/>
  <!-- check mark: done stops the reminders -->
  <path d="M46 65 L58 77 L83 51" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
